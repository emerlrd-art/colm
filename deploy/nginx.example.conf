server { listen 80; server_name colm.example; root /var/www/colm;
  location ~ ^/(app|storage|database|tools|deploy)/ { deny all; }
  location ~ \.php$ { if ($uri !~ ^/api/) { return 403; } include fastcgi_params; fastcgi_pass unix:/run/php/php-fpm.sock; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; } }
