<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Reset Password | COLM Registrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
  <main class="login-view">
    <section class="login-panel" aria-labelledby="resetPasswordTitle">
      <div class="login-seal">
        <img src="assets/images/colm_registrar_logo.png" alt="College of Mercy of Pulilan Foundation registrar seal">
      </div>
      <form class="login-form" id="resetPasswordForm">
        <p class="login-kicker">ACCOUNT RECOVERY</p>
        <h1 id="resetPasswordTitle">Set a new password</h1>
        <p class="login-subtitle">Choose a password with at least 8 characters.</p>
        <label for="newResetPassword">New password</label>
        <input id="newResetPassword" name="password" type="password" minlength="8" maxlength="256" autocomplete="new-password" required>
        <label for="confirmResetPassword">Confirm new password</label>
        <input id="confirmResetPassword" name="confirm_password" type="password" minlength="8" maxlength="256" autocomplete="new-password" required>
        <p class="login-error" id="resetPasswordError" role="alert" aria-live="polite"></p>
        <button class="login-submit" id="resetPasswordSubmit" type="submit">Reset password</button>
      </form>
      <p class="login-notice" id="resetPasswordNotice" role="status" aria-live="polite"></p>
      <p class="login-form"><a href="login.html">Back to login</a></p>
    </section>
    <footer class="login-footer">
      <strong>College of Our Lady of Mercy of Pulilan Foundation, Inc.</strong>
      <span>Registrar Document Request &amp; Tracking System</span>
      <span>&copy; 2026 COLM. Authorized access only.</span>
    </footer>
  </main>
  <script src="js/api.js"></script>
  <script src="js/auth.js?v=7"></script>
</body>
</html>
